name: Code Coverage

on:
  push:
    branches: [ main, master, develop ]
    paths:
      - '**.cpp'
      - '**.hpp'
      - '**.h'
      - '**.c'
      - '**/CMakeLists.txt'
      - '**.cmake'
      - 'test_expressions/**'
      - '.github/workflows/coverage.yml'
  pull_request:
    branches: [ main, master, develop ]
    paths:
      - '**.cpp'
      - '**.hpp'
      - '**.h'
      - '**.c'
      - '**/CMakeLists.txt'
      - '**.cmake'
      - 'test_expressions/**'
      - '.github/workflows/coverage.yml'
  workflow_dispatch:

# Permissions required for coverage reporting
permissions:
  contents: read
  actions: read
  pull-requests: read

# Cancel previous runs if a new commit is pushed to the same branch
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' && github.ref != 'refs/heads/master' }}

jobs:
  coverage:
    name: Code Coverage
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v6

    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          gcc \
          g++ \
          cmake \
          lcov \
          gcovr \
          git \
          bc \
          curl \
          jq

    - name: Create build directory
      run: cmake -E make_directory ${{github.workspace}}/build

    - name: Configure CMake with Coverage
      working-directory: ${{github.workspace}}/build
      run: |
        cmake .. \
          -DCMAKE_BUILD_TYPE=Debug \
          -DCMAKE_C_COMPILER=gcc \
          -DCMAKE_CXX_COMPILER=g++ \
          -DENABLE_COVERAGE=ON

    - name: Build project
      working-directory: ${{github.workspace}}/build
      run: cmake --build . --config Debug --parallel

    - name: Run tests
      working-directory: ${{github.workspace}}/build
      run: |
        # Run tests with error handling (fail the job on test failures)
        ctest --output-on-failure --verbose

    - name: Generate coverage data
      working-directory: ${{github.workspace}}/build
      run: |
        # Initialize coverage counters
        lcov --zerocounters --directory .

        # Run tests again to ensure coverage data is fresh
        ctest --output-on-failure

        # Create coverage info with lcov
        lcov --capture \
          --directory . \
          --output-file coverage.info \
          --rc branch_coverage=1 \
          --ignore-errors graph,gcov,unused,mismatch,source

        # Remove external libraries and system files from coverage
        lcov --remove coverage.info \
          '/usr/*' \
          '*/build/_deps/*' \
          '*/CMakeFiles/*' \
          '*/_deps/*' \
          '*/tests/unit/*' \
          '*/patches/*' \
          '*/catch2*' \
          '*/Catch2*' \
          --output-file coverage_filtered.info \
          --rc branch_coverage=1 \
          --ignore-errors unused,mismatch,source

        # Generate HTML report for debugging
        genhtml coverage_filtered.info \
          --output-directory coverage_html \
          --branch-coverage \
          --function-coverage \
          --title "BDD Demo Coverage Report"

        # Display coverage summary
        echo "=== Coverage Summary ==="
        lcov --summary coverage_filtered.info

    - name: Upload coverage to Coveralls
      uses: coverallsapp/github-action@v2
      id: coveralls
      with:
        github-token: ${{ secrets.GITHUB_TOKEN }}
        file: build/coverage_filtered.info
        format: lcov
        fail-on-error: false

    - name: Check coverage threshold on PR
      if: github.event_name == 'pull_request'
      run: |
        # Extract current coverage percentage from lcov summary
        # Look specifically for the "lines" coverage line and extract the percentage
        CURRENT_COVERAGE=$(lcov --summary build/coverage_filtered.info 2>&1 | \
          grep "^\s*lines\.*:" | \
          grep -oE '[0-9]+(\.[0-9]+)?' | head -1 || echo "")
        
        # Validate current coverage was extracted
        if [ -z "$CURRENT_COVERAGE" ]; then
          echo "⚠️  Warning: Could not extract current coverage from lcov. Skipping gate check."
          exit 0
        fi
        
        # Validate current coverage is numeric (whole number or proper decimal)
        if ! [[ "$CURRENT_COVERAGE" =~ ^[0-9]+(\.[0-9]+)?$ ]]; then
          echo "⚠️  Warning: Invalid current coverage value: '${CURRENT_COVERAGE}'. Skipping gate check."
          exit 0
        fi
        
        echo "Current coverage: ${CURRENT_COVERAGE}%"
        
        # Special-case current coverage of 0% to catch likely misconfigurations
        if [[ "$CURRENT_COVERAGE" =~ ^0+(\.0+)?$ ]]; then
          echo "⚠️  Warning: Current coverage is 0%. This may indicate a configuration issue (no tests ran or coverage was not captured). Skipping gate check."
          exit 0
        fi
        
        # Get base branch coverage from Coveralls API
        # Note: This requires the base branch to have coverage data already uploaded
        BASE_BRANCH="${{ github.base_ref }}"
        REPO_SLUG="${{ github.repository }}"
        
        # URL encode the branch name and repository slug
        BASE_BRANCH_ENCODED=$(printf %s "$BASE_BRANCH" | jq -sRr @uri)
        REPO_SLUG_ENCODED=$(printf %s "$REPO_SLUG" | jq -sRr @uri)
        
        # Fetch base branch coverage from Coveralls with proper error handling
        BASE_COVERAGE_RESPONSE=$(curl -s --fail-with-body --max-time 10 --retry 2 \
          "https://coveralls.io/github/${REPO_SLUG_ENCODED}.json?branch=${BASE_BRANCH_ENCODED}" 2>&1 | tee /dev/stderr || echo "{}")
        
        # Extract coverage percentage from JSON response using jq
        # This is more reliable than grep for JSON parsing
        BASE_COVERAGE=$(echo "$BASE_COVERAGE_RESPONSE" | jq -r '.covered_percent // empty' 2>/dev/null || echo "")
        
        # Validate base coverage is available and numeric
        if [ -z "$BASE_COVERAGE" ]; then
          echo "⚠️  Warning: Could not fetch base branch coverage from Coveralls. Skipping gate check."
          echo "This is expected for the first PR or if base branch hasn't been analyzed yet."
          exit 0
        fi
        
        # Validate base coverage is numeric (whole number or proper decimal)
        if ! [[ "$BASE_COVERAGE" =~ ^[0-9]+(\.[0-9]+)?$ ]]; then
          echo "⚠️  Warning: Invalid base coverage value: '${BASE_COVERAGE}'. Skipping gate check."
          exit 0
        fi
        
        # Skip check if base coverage is 0 (no previous data)
        if (( $(echo "$BASE_COVERAGE == 0" | bc -l) )); then
          echo "⚠️  Warning: Base branch coverage is 0%. Skipping gate check."
          echo "This is expected for the first PR with coverage."
          exit 0
        fi
        
        echo "Base coverage (${BASE_BRANCH}): ${BASE_COVERAGE}%"
        
        # Calculate coverage change
        COVERAGE_CHANGE=$(echo "$CURRENT_COVERAGE - $BASE_COVERAGE" | bc -l)
        echo "Coverage change: ${COVERAGE_CHANGE}%"
        
        # Check if coverage decreased by more than 2%
        THRESHOLD=-2.0
        if (( $(echo "$COVERAGE_CHANGE < $THRESHOLD" | bc -l) )); then
          echo "❌ Coverage gate failed!"
          echo "Coverage decreased by ${COVERAGE_CHANGE}% (threshold: ${THRESHOLD}%)"
          echo "Current: ${CURRENT_COVERAGE}%, Base: ${BASE_COVERAGE}%"
          echo ""
          echo "Please add tests to ensure coverage does not decrease by more than 2%."
          exit 1
        else
          echo "✅ Coverage gate passed!"
          echo "Coverage change: ${COVERAGE_CHANGE}% (threshold: ${THRESHOLD}%)"
        fi

    - name: Upload coverage reports as artifact
      uses: actions/upload-artifact@v6
      with:
        name: coverage-reports
        path: |
          build/coverage_filtered.info
          build/coverage_html/
        retention-days: 30