# SPDX-License-Identifier: MIT
# Auto-generated dependency check workflow for DagIR

name: CMake Dependency Check

on:
  schedule:
    - cron: '0 6 * * 1' # weekly on Mondays at 06:00 UTC
  workflow_dispatch:
    inputs:
      create_pr:
        description: 'Create PR if updates are available'
        required: false
        default: 'true'
        type: boolean

permissions:
  contents: write
  pull-requests: write
  issues: write

jobs:
  check-deps:
    name: Check FetchContent dependencies
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
    - name: Checkout code
      uses: actions/checkout@v5

    - name: Extract pinned GIT_TAGs
      id: extract
      run: |
        set -euo pipefail
        # Look for FetchContent_Declare blocks with GIT_REPOSITORY and GIT_TAG
        perl -0777 -ne 'while(/FetchContent_Declare\((.*?)\)/sg){ print "$1\n---\n" }' CMakeLists.txt | \
          awk 'BEGIN{RS="---"} /GIT_REPOSITORY/ && /GIT_TAG/ {print $0}' > /tmp/fetch_blocks.txt || true
        echo "Found blocks:"; cat /tmp/fetch_blocks.txt || true
        # Normalize to lines of: name|repo|tag
        python3 - <<'PY'
import re,sys
blocks=open('/tmp/fetch_blocks.txt').read().strip().split('---')
out=[]
for b in blocks:
    if not b.strip(): continue
    # project name is the first token
    m = re.search(r'^\s*([A-Za-z0-9_\-]+)', b)
    name = m.group(1) if m else 'unknown'
    repo = re.search(r'GIT_REPOSITORY\s+([^\n\r]+)', b)
    tag = re.search(r'GIT_TAG\s+([^\n\r]+)', b)
    if repo and tag:
        repo_url=repo.group(1).strip()
        tag_s=tag.group(1).strip()
        print(f"{name}|{repo_url}|{tag_s}")
PY
        echo "::set-output name=blocks::$(cat /tmp/fetch_blocks.txt | wc -l)"

    - name: Check versions
      id: check
      run: |
        set -euo pipefail
        # Hardcoded checks for known repos — extend as needed
        python3 - <<'PY'
import re,subprocess,sys

# Parse lines emitted by previous step
# Re-run parsing to get structured output
import os
with open('CMakeLists.txt') as f:
    txt=f.read()

blocks=[]
for m in re.finditer(r'FetchContent_Declare\((.*?)\)', txt, re.S):
    block=m.group(1)
    if 'GIT_REPOSITORY' in block and 'GIT_TAG' in block:
        name_match=re.search(r'^\s*([A-Za-z0-9_\-]+)', block)
        name=name_match.group(1) if name_match else 'unknown'
        repo_match=re.search(r'GIT_REPOSITORY\s+([^\n\r]+)', block)
        tag_match=re.search(r'GIT_TAG\s+([^\n\r]+)', block)
        if repo_match and tag_match:
            repo=repo_match.group(1).strip()
            tag=tag_match.group(1).strip()
            blocks.append((name,repo,tag))


# Map repo URL to GitHub API owner/repo if possible
for name,repo,tag in blocks:
    if 'github.com' not in repo:
        print(f"Skipping non-GitHub repo for {name}: {repo}")
        continue
    # normalize URL
    repo_path=re.sub(r"^.*github.com[:/]?","",repo).rstrip('/').replace('.git','')
    api_url=f"https://api.github.com/repos/{repo_path}/releases/latest"
    try:
        out=subprocess.check_output(['curl','-s',api_url]).decode('utf-8')
    except subprocess.CalledProcessError:
        print(f"Failed to query GitHub for {repo_path}")
        continue
    import json
    try:
        data=json.loads(out)
    except Exception:
        print(f"No JSON response for {repo_path}")
        continue
    latest_tag=data.get('tag_name') or data.get('name')
    if not latest_tag:
        print(f"No release tag for {repo_path}; skipping")
        continue
    print(f"{name}: pinned={tag} latest={latest_tag} repo={repo_path}")
    if tag==latest_tag:
        print(f"  OK: {name} up to date")
    else:
        print(f"  UPDATE AVAILABLE: {name} {tag} -> {latest_tag}")
PY

    - name: Create pull request for updates
      if: ${{ github.event.inputs.create_pr == 'true' || github.event_name == 'schedule' }}
      env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
      set -euo pipefail
      # Re-parse to get structured blocks and detect available updates
      python3 - <<'PY'
  import re,subprocess,sys,json
  with open('CMakeLists.txt') as f: txt=f.read()
  blocks=[]
  for m in re.finditer(r'FetchContent_Declare\((.*?)\)', txt, re.S):
    block=m.group(1)
    if 'GIT_REPOSITORY' in block and 'GIT_TAG' in block:
      name_match=re.search(r'^\s*([A-Za-z0-9_\-]+)', block)
      name=name_match.group(1) if name_match else 'unknown'
      repo_match=re.search(r'GIT_REPOSITORY\s+([^\n\r]+)', block)
      tag_match=re.search(r'GIT_TAG\s+([^\n\r]+)', block)
      if repo_match and tag_match:
        repo=repo_match.group(1).strip()
        tag=tag_match.group(1).strip()
        blocks.append((name,repo,tag))

  updates=[]
  for name,repo,tag in blocks:
    if 'github.com' not in repo:
      continue
    repo_path=re.sub(r"^.*github.com[:/]?","",repo).rstrip('/').replace('.git','')
    api_url=f"https://api.github.com/repos/{repo_path}/releases/latest"
    try:
      out=subprocess.check_output(['curl','-s',api_url])
      data=json.loads(out)
      latest=data.get('tag_name') or data.get('name')
      if latest and latest!=tag:
        updates.append((name,repo_path,tag,latest))
    except Exception:
      continue

  if not updates:
    print('No updates detected')
    sys.exit(0)

  print('Updates to apply:')
  for u in updates: print(u)

  # Create branch and modify CMakeLists.txt
  BRANCH=f"chore/update-deps-{'-'.join([u[0] for u in updates])}"
  subprocess.check_call(['git','checkout','-b',BRANCH])
  orig=open('CMakeLists.txt').read()
  new=orig
  for name,repo,tag,latest in updates:
    # Replace first occurrence of the GIT_TAG for this block robustly
    pattern=re.compile(r'(FetchContent_Declare\([\s\S]*?'+re.escape(name)+r'[\s\S]*?GIT_TAG\s*)'+re.escape(tag)+r'\b', re.M)
    new, n = pattern.subn(r"\1"+latest, new, count=1)
    if n==0:
      # Targeted fallback: only replace when the tag appears as the GIT_TAG
      # inside the FetchContent_Declare block for this dependency. This
      # avoids accidental replacements elsewhere in the file.
      block_pattern = re.compile(r'(FetchContent_Declare\([\s\S]*?'+re.escape(name)+r'[\s\S]*?GIT_TAG\s*)('+re.escape(tag)+r')\b', re.M)
      new, m = block_pattern.subn(r"\1"+latest, new, count=1)
      if m == 0:
        # Still failed — do not perform a blind replace. Log and skip.
        print(f"Warning: could not safely replace tag for {name} (tag={tag}); skipping update for this dependency")
        continue

  if new==orig:
    print('Failed to update CMakeLists.txt automatically')
    sys.exit(1)

  open('CMakeLists.txt','w').write(new)
  subprocess.check_call(['git','config','user.name','github-actions[bot]'])
  subprocess.check_call(['git','config','user.email','github-actions[bot]@users.noreply.github.com'])
  subprocess.check_call(['git','add','CMakeLists.txt'])
  msg='chore(deps): update pinned FetchContent GIT_TAGs'
  subprocess.check_call(['git','commit','-s','-m',msg])
  subprocess.check_call(['git','push','-u','origin',BRANCH])

  # Create PR using gh if available, otherwise use GitHub API via curl
  try:
    pr_title=msg
    body='Automated update of pinned FetchContent GIT_TAGs.'
    subprocess.check_call(['gh','pr','create','--title',pr_title,'--body',body,'--base','main','--head',BRANCH])
  except Exception:
    # fallback: use GitHub API to create PR
    import os,urllib.parse
    repo_full=os.environ['GITHUB_REPOSITORY']
    api_url=f"https://api.github.com/repos/{repo_full}/pulls"
    payload={'title':msg,'head':BRANCH,'base':'main','body':'Automated dependency updates.'}
    import json,subprocess
    subprocess.check_call(['curl','-s','-X','POST','-H',f"Authorization: token {os.environ['GITHUB_TOKEN']}",' -H','Content-Type: application/json','-d',json.dumps(payload),api_url])
  PY
