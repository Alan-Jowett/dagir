# SPDX-License-Identifier: MIT
# Auto-generated dependency check workflow for DagIR

name: CMake Dependency Check

on:
  schedule:
    - cron: '0 6 * * 1' # weekly on Mondays at 06:00 UTC
  workflow_dispatch:
    inputs:
      create_pr:
        description: 'Create PR if updates are available'
        required: false
        default: 'false'
        type: boolean

permissions:
  contents: write
  pull-requests: write
  issues: write

jobs:
  check-deps:
    name: Check FetchContent dependencies
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
    - name: Checkout code
      uses: actions/checkout@v5

    - name: Extract pinned GIT_TAGs
      id: extract
      run: |
        set -euo pipefail
        # Look for FetchContent_Declare blocks with GIT_REPOSITORY and GIT_TAG
        perl -0777 -ne 'while(/FetchContent_Declare\((.*?)\)/sg){ print "$1\n---\n" }' CMakeLists.txt | \
          awk 'BEGIN{RS="---"} /GIT_REPOSITORY/ && /GIT_TAG/ {print $0}' > /tmp/fetch_blocks.txt || true
        echo "Found blocks:"; cat /tmp/fetch_blocks.txt || true
        # Normalize to lines of: name|repo|tag
        python3 - <<'PY'
import re,sys
blocks=open('/tmp/fetch_blocks.txt').read().strip().split('---')
out=[]
for b in blocks:
    if not b.strip(): continue
    # project name is the first token
    m = re.search(r'^\s*([A-Za-z0-9_\-]+)', b)
    name = m.group(1) if m else 'unknown'
    repo = re.search(r'GIT_REPOSITORY\s+([^\n\r]+)', b)
    tag = re.search(r'GIT_TAG\s+([^\n\r]+)', b)
    if repo and tag:
        repo_url=repo.group(1).strip()
        tag_s=tag.group(1).strip()
        print(f"{name}|{repo_url}|{tag_s}")
PY
        echo "::set-output name=blocks::$(cat /tmp/fetch_blocks.txt | wc -l)"

    - name: Check versions
      id: check
      run: |
        set -euo pipefail
        # Hardcoded checks for known repos — extend as needed
        python3 - <<'PY'
import re,subprocess,sys

# Parse lines emitted by previous step
# Re-run parsing to get structured output
import os
with open('CMakeLists.txt') as f:
    txt=f.read()

blocks=[]
for m in re.finditer(r'FetchContent_Declare\((.*?)\)', txt, re.S):
    block=m.group(1)
    if 'GIT_REPOSITORY' in block and 'GIT_TAG' in block:
        name_match=re.search(r'^\s*([A-Za-z0-9_\-]+)', block)
        name=name_match.group(1) if name_match else 'unknown'
        repo_match=re.search(r'GIT_REPOSITORY\s+([^\n\r]+)', block)
        tag_match=re.search(r'GIT_TAG\s+([^\n\r]+)', block)
        if repo_match and tag_match:
            repo=repo_match.group(1).strip()
            tag=tag_match.group(1).strip()
            blocks.append((name,repo,tag))


# Map repo URL to GitHub API owner/repo if possible
for name,repo,tag in blocks:
    if 'github.com' not in repo:
        print(f"Skipping non-GitHub repo for {name}: {repo}")
        continue
    # normalize URL
    repo_path=re.sub(r"^.*github.com[:/]?","",repo).rstrip('/').replace('.git','')
    api_url=f"https://api.github.com/repos/{repo_path}/releases/latest"
    try:
        out=subprocess.check_output(['curl','-s',api_url]).decode('utf-8')
    except subprocess.CalledProcessError:
        print(f"Failed to query GitHub for {repo_path}")
        continue
    import json
    try:
        data=json.loads(out)
    except Exception:
        print(f"No JSON response for {repo_path}")
        continue
    latest_tag=data.get('tag_name') or data.get('name')
    if not latest_tag:
        print(f"No release tag for {repo_path}; skipping")
        continue
    print(f"{name}: pinned={tag} latest={latest_tag} repo={repo_path}")
    if tag==latest_tag:
        print(f"  OK: {name} up to date")
    else:
        print(f"  UPDATE AVAILABLE: {name} {tag} -> {latest_tag}")
PY

    - name: Create issue if updates found
      if: always()
      uses: actions/github-script@v8
      with:
        script: |
          // This step is intentionally a placeholder. It can be extended to create
          // issues or PRs when updates are detected in the previous step. For
          // safety we don't auto-create PRs by default; pass `create_pr=true` to
          // the workflow_dispatch input to enable PR creation in future.
          console.log('Dependency check completed. Review logs to see if updates are available.')
